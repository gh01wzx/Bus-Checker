name: Collect bus data

concurrency:
  group: bus-data-pipeline
  cancel-in-progress: false

on:
  schedule:
    - cron: "*/10 19-23 * * *"
    - cron: "*/10 0-7 * * *"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-engineering.txt
      - run: python pipeline.py collect --burst
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AT_SUB_KEY: ${{ secrets.AT_SUB_KEY }}
      - name: Build and test analytics
        run: python pipeline.py build
        env:
          BUS_BACKEND: postgres
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
