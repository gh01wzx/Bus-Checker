name: Pipeline and dbt quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-warehouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-engineering.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes pyright@1.1.414 dashboard.py pipeline.py bus_checker tests
      - run: python -m unittest discover -s tests -v
      - run: python tests/check_warehouse.py
