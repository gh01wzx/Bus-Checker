name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and tests (DuckDB + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      BUS_TEST_POSTGRES_URL: postgresql://postgres:ci-only@localhost:5432/postgres
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: dbt parse
        env:
          BUS_BACKEND: duckdb
          BUS_DUCKDB_PATH: /tmp/parse.duckdb
        run: dbt parse --project-dir bus_dbt --profiles-dir bus_dbt --target duckdb
      - name: Tests (unit, integration on DuckDB and PostgreSQL, dashboard pages)
        run: pytest -q

  stack:
    name: Docker stack (${{ matrix.backend }})
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [postgres, duckdb]
    steps:
      - uses: actions/checkout@v4
      - name: Build, run the realtime DAG against fixtures and verify the dashboard
        env:
          BUS_BACKEND: ${{ matrix.backend }}
        run: bash tests/stack/run_stack.sh
