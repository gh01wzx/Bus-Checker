services:
  fixture:
    image: bus-checker-local:airflow-3.2.2
    pull_policy: never
    entrypoint: ["/opt/airflow/bus-venv/bin/python", "/fixtures/serve.py"]
    volumes:
      - ./tests/fixtures:/fixtures:ro
  airflow:
    environment:
      AT_SUB_KEY: fixture-only
      AT_TRIP_UPDATES_URL: http://fixture:8000/trips
      AT_GTFS_URL: http://fixture:8000/gtfs.zip
    depends_on:
      fixture:
        condition: service_started
