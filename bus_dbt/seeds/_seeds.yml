version: 2

seeds:
  - name: nz_public_holidays
    description: >
      National public holidays plus Auckland Anniversary Day, Mondayised where the law
      requires. Extend this file each year; dates outside it fall back to weekday/weekend.
    config:
      column_types:
        holiday_date: date
        holiday_name: varchar
    columns:
      - name: holiday_date
        data_tests: [not_null, unique]
